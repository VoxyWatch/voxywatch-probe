name: Native Linux validation and build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Binary version (without v; builds only, never publishes)
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # Native CGO/libpcap builds use Debian 12's glibc 2.36 baseline.
    container: golang:1.26.6-bookworm
    env:
      CGO_ENABLED: '1'
      BUILD_VERSION: ${{ inputs.version || '1.0.0' }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          persist-credentials: false
      - name: Install build and test prerequisites
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends libpcap-dev python3
      - name: Native tests and reproducible versioned build
        shell: bash
        run: bash tools/native-build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node24
        with:
          name: probe-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
