name: Native Linux validation and build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Binary version (without v; builds only, never publishes)
        required: true
        default: 0.2.1-beta
        type: string

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # Native CGO/libpcap builds use Debian 12's glibc 2.36 baseline.
    container: golang:1.26.6-bookworm
    env:
      CGO_ENABLED: '1'
      BUILD_VERSION: ${{ inputs.version || '0.2.1-beta' }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build and test prerequisites
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends libpcap-dev python3
      - name: Native tests and reproducible versioned build
        shell: bash
        run: bash tools/native-build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
